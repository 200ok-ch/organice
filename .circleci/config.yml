# Temporary: exports env vars encrypted for migration to GitHub Actions. Delete after use.
version: 2.1
jobs:
  export:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Encrypted export
          command: |
            command -v gpg >/dev/null || (sudo apt-get update -yq && sudo apt-get install -yq gnupg)
            echo "" | base64 -d | gpg --batch --quiet --import
            for v in FTP_HOST FTP_USER FTP_PASSWD FTP_USER_STAGE FTP_PASSWD_STAGE REACT_APP_DROPBOX_CLIENT_ID REACT_APP_GITLAB_CLIENT_ID REACT_APP_GITLAB_SECRET; do
              printf '%s %s\n' "$v" "$(printf '%s' "${!v}" | base64 -w0)"
            done | gpg --batch --trust-model always --armor --encrypt --recipient "organice secret export"
workflows:
  export:
    jobs:
      - export
